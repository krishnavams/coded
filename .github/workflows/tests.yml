name: tests

# Runs the (offline) test suite on Linux, macOS and Windows. The suite needs no
# API keys: tests/conftest.py starts in-process fake servers.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e '.[dev,tui,docs]'

      - name: Show the resolved shell
        run: python -c "from coded.shells import active_shell; s = active_shell(); print(s.name, s.path or '(sh)', s.label)"

      - name: Test
        run: pytest -q
