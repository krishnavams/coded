name: coded review

# Runs the coded reviewer→qa→security pipeline on every pull request and fails
# the check if the synthesized verdict is NEEDS_CHANGES.
#
# Setup: add an OPENAI_API_KEY (or another provider's key) repository secret —
# Settings → Secrets and variables → Actions → New repository secret. Without
# one the job skips with a notice instead of failing the pull request.
#
# Point coded at a different provider by editing the `coded review` flags below
# (e.g. --provider groq --model-name llama-3.3-70b-versatile) and passing that
# provider's key in `env` instead.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff against the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for a model key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=coded review skipped::No OPENAI_API_KEY secret is set, so \
            there is no model to review with. Add one under Settings → Secrets and variables \
            → Actions, or edit .github/workflows/coded-review.yml to use another provider."
          fi

      - name: Install coded
        if: steps.key.outputs.configured == 'true'
        run: pip install -e .

      - name: Run review
        if: steps.key.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          coded review --yolo --output review.md \
            "the changes in this pull request against origin/${{ github.base_ref }} — \
             use the git tool to see the diff (git diff origin/${{ github.base_ref }}...HEAD)"

      - name: Upload review report
        if: always() && steps.key.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coded-review
          path: review.md
